<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Stage Selector Studies | AIRLAB</title>
  <link rel="stylesheet" href="./stages.css">
</head>
<body>
  <header class="study-toolbar">
    <a href="/">AIRLAB</a>
    <label>Layout <select id="layout"></select></label>
    <button id="previous" class="icon" title="Previous layout" aria-label="Previous layout"><i data-lucide="chevron-left"></i></button>
    <button id="next" class="icon" title="Next layout" aria-label="Next layout"><i data-lucide="chevron-right"></i></button>
    <button id="compare" title="Compare layouts" aria-expanded="false"><i data-lucide="layout-grid"></i><span>Compare</span></button>
    <button id="choose"><i data-lucide="check"></i><span>Choose layout</span></button>
  </header>
  <section id="comparison" hidden aria-label="Layout options"></section>
  <main class="arena-preview">
    <img class="arena-image" src="./stage-arena.png" alt="Driving drill in the AIRLAB arena">
    <div class="game-menu">Menu</div>
    <div class="objective">Reach the yellow target</div>
    <nav id="stage-selector" aria-label="Drill stages"></nav>
    <div class="boost"><strong>100</strong><span>BOOST</span></div>
    <div id="preview-label"></div>
  </main>
  <script type="module" src="./stages.js"></script>
</body>
</html>
